openapi: 3.2.0
info:
  title: Manhattan Active Supply Chain (WMS) Inbound API
  description: Manhattan Active Supply Chain APIs provide warehouse management (WMS) capabilities including inventory tracking, order processing, labor management, yard management, and shipment execution for distribution center operations.
  version: 1.0.0
  contact:
    name: Manhattan Associates Developer Support
    url: https://developer.manh.com/
  license:
    name: Proprietary
    url: https://www.manh.com/terms-of-use
servers:
- url: https://api.developer.manh.com/wms/v1
  description: Manhattan Active Supply Chain (WMS) REST API
security:
- OAuth2ClientCredentials: []
tags:
- name: Inbound
  description: ASN and receipt management
paths:
  /receipts:
    get:
      operationId: listReceipts
      summary: List inbound receipts
      description: Retrieve inbound receipt records for advance shipment notices and received inventory.
      tags:
      - Inbound
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - expected
          - in_progress
          - completed
          - closed
      - name: facilityId
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: List of receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptListResponse'
    post:
      operationId: createReceipt
      summary: Create an advance shipment notice (ASN)
      description: Create an ASN to pre-notify the warehouse of an inbound shipment.
      tags:
      - Inbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreateRequest'
      responses:
        '201':
          description: ASN created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
  /receipts/{receiptId}:
    get:
      operationId: getReceipt
      summary: Get receipt details
      description: Retrieve full details of an inbound receipt.
      tags:
      - Inbound
      parameters:
      - name: receiptId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Receipt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ReceiptCreateRequest:
      type: object
      required:
      - facilityId
      - supplierId
      - lines
      properties:
        externalASNId:
          type: string
        facilityId:
          type: string
        supplierId:
          type: string
        expectedArrivalDate:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReceiptLineRequest'
    Receipt:
      type: object
      properties:
        receiptId:
          type: string
        externalASNId:
          type: string
        facilityId:
          type: string
        supplierId:
          type: string
        status:
          type: string
          enum:
          - expected
          - in_progress
          - completed
          - closed
        expectedArrivalDate:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptLine'
        createdAt:
          type: string
          format: date-time
    ReceiptListResponse:
      type: object
      properties:
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        totalCount:
          type: integer
    ReceiptLineRequest:
      type: object
      required:
      - itemId
      - expectedQuantity
      properties:
        itemId:
          type: string
        expectedQuantity:
          type: number
        uom:
          type: string
        lotNumber:
          type: string
    ReceiptLine:
      type: object
      properties:
        lineId:
          type: string
        itemId:
          type: string
        expectedQuantity:
          type: number
        receivedQuantity:
          type: number
        uom:
          type: string
        lotNumber:
          type: string
        expirationDate:
          type: string
          format: date
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.developer.manh.com/oauth2/token
          scopes:
            wms:read: Read warehouse data
            wms:write: Write warehouse operations
externalDocs:
  description: Manhattan Active Supply Chain Developer Portal
  url: https://supplychain.developer.manh.com/
