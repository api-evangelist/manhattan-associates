specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Manhattan Associates
providerId: manhattan-associates
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Supply Chain
  - Order Management
description: 'FOCUS-aligned FinOps for Manhattan Associates: enterprise SaaS contract for the Manhattan
  Active platform suite. APIs are not separately metered; cost lines are SaaS subscription, transaction
  volumes (orders, shipments, fulfillments), and implementation services.'
sources:
  - https://www.manh.com
notes: No public pricing/billing surface; meters reflect typical SaaS supply-chain contract lines.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Manhattan Associates, Inc.
serviceCategory: Supply Chain Software
billingModel:
  pricingCategory: Enterprise SaaS
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Manhattan Active
  ServiceCategory: Supply Chain Software
  ProviderName: Manhattan Associates
  PublisherName: Manhattan Associates, Inc.
  InvoiceIssuerName: Manhattan Associates, Inc.
  BillingCurrency: USD
meters:
  - name: subscription_fee
    unit: year
    aggregation: sum
    dimensions:
      - product
  - name: orders_processed
    unit: order
    aggregation: sum
    dimensions:
      - channel
  - name: shipments
    unit: shipment
    aggregation: sum
  - name: warehouses
    unit: site
    aggregation: max
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - integration
principles:
  - name: Visibility
    description: Pull order / shipment / API call metrics from the Manhattan Active console; reconcile
      against contracted volumes.
  - name: Allocation
    description: Tag orders/shipments by channel / business unit; map Manhattan tenants to internal
      product lines for chargeback.
  - name: Optimization
    description: Consolidate integrations onto Manhattan Active platform APIs; retire legacy TMS/WMS
      connectors as Active modules absorb scope.
  - name: Accountability
    description: Owners review contracted-volume burn quarterly; renegotiate at renewal as channel mix
      and geography change.
