specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Manhattan Associates
providerId: manhattan-associates
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Supply Chain
  - Order Management
  - Warehouse Management
  - Omnichannel
  - Logistics
description: Manhattan Associates sells the Manhattan Active platform (Omni, Supply Chain, Supply Chain
  Planning, TMS/WMS) through enterprise sales. APIs are exposed to existing Manhattan Active customers;
  pricing is contract-driven and not publicly listed. Treat as enterprise-only until Manhattan publishes
  a public plans surface.
sources:
  - https://www.manh.com
notes: Public pricing not disclosed; pricing is custom and obtained via Request Demo / Contact Us flows.
plans:
  - id: manhattan-associates-active
    name: Manhattan Active (Customer)
    type: enterprise
    description: API access for existing Manhattan Active platform customers — Omni, Supply Chain,
      Supply Chain Planning, TMS/WMS. Tied to underlying SaaS subscription.
    entries:
      - label: Manhattan Active subscription
        name: subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: tied to underlying Manhattan Active subscription
        userMultiplied: false
    elements:
      - name: Manhattan Active Omni
      - name: Manhattan Active Supply Chain
      - name: Manhattan Active Supply Chain Planning
      - name: Promise & Fulfill APIs
      - name: Customer / partner integration scopes
  - id: manhattan-associates-enterprise
    name: Enterprise (Contact Sales)
    type: enterprise
    description: Custom enterprise contract for Manhattan Associates platform deployments.
    entries:
      - label: Custom contract
        name: custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Manhattan Active platform suite
      - name: TMS/WMS legacy integrations
      - name: Implementation services
      - name: Dedicated account team
