naftiko: 1.0.0-alpha2
info:
  label: Manhattan Active Omni Order Management API — Orders
  description: 'Manhattan Active Omni Order Management API — Orders. 5 operations. Lead operation: List orders. Self-contained
    Naftiko capability covering one Manhattan Associates business surface.'
  tags:
  - Manhattan Associates
  - Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MANHATTAN_ASSOCIATES_API_KEY: MANHATTAN_ASSOCIATES_API_KEY
capability:
  consumes:
  - type: http
    namespace: omni-orders
    baseUri: https://api.developer.manh.com/omni/v1
    description: Manhattan Active Omni Order Management API — Orders business capability. Self-contained, no shared references.
    resources:
    - name: orders
      path: /orders
      operations:
      - name: listorders
        method: GET
        description: List orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: customerId
          in: query
          type: string
        - name: channelId
          in: query
          type: string
        - name: orderDateFrom
          in: query
          type: string
        - name: orderDateTo
          in: query
          type: string
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
      - name: createorder
        method: POST
        description: Create an order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: orders-orderId
      path: /orders/{orderId}
      operations:
      - name: getorder
        method: GET
        description: Get an order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          required: true
      - name: updateorder
        method: PATCH
        description: Update an order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: orders-orderId-cancel
      path: /orders/{orderId}/cancel
      operations:
      - name: cancelorder
        method: POST
        description: Cancel an order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.MANHATTAN_ASSOCIATES_API_KEY}}'
  exposes:
  - type: rest
    namespace: omni-orders-rest
    port: 8080
    description: REST adapter for Manhattan Active Omni Order Management API — Orders. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/orders
      name: orders
      description: REST surface for orders.
      operations:
      - method: GET
        name: listorders
        description: List orders
        call: omni-orders.listorders
        with:
          status: rest.status
          customerId: rest.customerId
          channelId: rest.channelId
          orderDateFrom: rest.orderDateFrom
          orderDateTo: rest.orderDateTo
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createorder
        description: Create an order
        call: omni-orders.createorder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{orderid}
      name: orders-orderid
      description: REST surface for orders-orderId.
      operations:
      - method: GET
        name: getorder
        description: Get an order
        call: omni-orders.getorder
        with:
          orderId: rest.orderId
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateorder
        description: Update an order
        call: omni-orders.updateorder
        with:
          orderId: rest.orderId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{orderid}/cancel
      name: orders-orderid-cancel
      description: REST surface for orders-orderId-cancel.
      operations:
      - method: POST
        name: cancelorder
        description: Cancel an order
        call: omni-orders.cancelorder
        with:
          orderId: rest.orderId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: omni-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Manhattan Active Omni Order Management API — Orders. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-orders
      description: List orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: omni-orders.listorders
      with:
        status: tools.status
        customerId: tools.customerId
        channelId: tools.channelId
        orderDateFrom: tools.orderDateFrom
        orderDateTo: tools.orderDateTo
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: create-order
      description: Create an order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: omni-orders.createorder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-order
      description: Get an order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: omni-orders.getorder
      with:
        orderId: tools.orderId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-order
      description: Update an order
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: omni-orders.updateorder
      with:
        orderId: tools.orderId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: cancel-order
      description: Cancel an order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: omni-orders.cancelorder
      with:
        orderId: tools.orderId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
